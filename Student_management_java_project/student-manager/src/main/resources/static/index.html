<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        h2 {
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 5px;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }
        table {
            background: white;
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        th {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<h2>Student Manager</h2>

<!-- Add Student Form -->
<div class="card">
    <h3>Add Student</h3>
    <input type="text" id="name" placeholder="Enter name">
    <input type="text" id="email" placeholder="Enter email">
    <input type="text" id="course" placeholder="Enter course">
    <button onclick="addStudent()">Add Student</button>
</div>

<!-- Table -->
<h3>All Students</h3>
<table id="studentTable">
    <thead>
    <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Course</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    async function addStudent() {
        const student = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            course: document.getElementById("course").value
        };

        await fetch("http://localhost:8080/api/students/add", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(student)
        });

        alert("Student Added!");
        loadStudents();
    }

    async function loadStudents() {
        const res = await fetch("http://localhost:8080/api/students/all");
        const data = await res.json();

        const table = document.querySelector("#studentTable tbody");
        table.innerHTML = "";

        data.forEach(st => {
            table.innerHTML += `
                <tr>
                    <td>${st.id}</td>
                    <td>${st.name}</td>
                    <td>${st.email}</td>
                    <td>${st.course}</td>
                </tr>
            `;
        });
    }

    loadStudents();
</script>

</body>
</html>
